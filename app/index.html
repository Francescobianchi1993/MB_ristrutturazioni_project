<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="description" content="MB Ristrutturazioni — ristrutturazioni chiavi in mano a Roma. Preventivo online, sopralluogo gratuito e squadra interna dalla demolizione alla consegna." />
    <!-- Il sito è pubblico e indicizzabile sul dominio vero. Dev e *.vercel.app
         restano fuori dall'indice tramite header X-Robots-Tag host-based in vercel.json
         (così l'URL grezzo di Vercel non fa contenuto duplicato). -->
    <link rel="canonical" href="https://www.mbristrutturazioniroma.it/" />
    <title>MB Ristrutturazioni — Roma</title>

    <!-- Anteprima quando il link viene condiviso (WhatsApp, Facebook, ecc.).
         URL assoluti sul dominio pubblico vero. Il dominio servito è la versione
         con www (l'apex fa redirect 308 → www), quindi canonical e og puntano a www. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MB Ristrutturazioni" />
    <meta property="og:title" content="MB Ristrutturazioni — ristrutturazioni chiavi in mano a Roma" />
    <meta property="og:description" content="Preventivo online, sopralluogo gratuito e squadra interna dalla demolizione alla consegna." />
    <meta property="og:locale" content="it_IT" />
    <meta property="og:url" content="https://www.mbristrutturazioniroma.it/" />
    <meta property="og:image" content="https://www.mbristrutturazioniroma.it/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="MB Ristrutturazioni — ristrutturazioni chiavi in mano a Roma" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MB Ristrutturazioni — ristrutturazioni chiavi in mano a Roma" />
    <meta name="twitter:description" content="Preventivo online, sopralluogo gratuito e squadra interna dalla demolizione alla consegna." />
    <meta name="twitter:image" content="https://www.mbristrutturazioniroma.it/og-image.jpg" />
    <!-- Font ospitati sul nostro dominio (public/fonts.css → public/fonts/*.woff2).
         NON usiamo il CDN di Google: caricava l'IP di ogni visitatore sui server
         Google (USA) prima del consenso cookie — trattamento senza base giuridica
         già sanzionato in UE. I .woff2 vengono dallo stesso dominio, nessun terzo. -->
    <link rel="stylesheet" href="/fonts.css" />
    <!-- Meta Pixel — caricato SOLO dopo il consenso cookie (vedi src/lib/consent.ts).
         Nulla viene inviato a Facebook finché non si chiama window.loadMetaPixel(). -->
    <script>
      window.__MB_PIXEL_ID = '1411878520959629';
      window.loadMetaPixel = function () {
        if (window.__mbPixelLoaded) return;
        window.__mbPixelLoaded = true;
        !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');
        window.fbq('init', window.__MB_PIXEL_ID);
        window.fbq('track', 'PageView');
      };
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
